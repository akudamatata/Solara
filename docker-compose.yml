version: '3.8'
services:
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - NAS_DOWNLOAD_DIR=/app/downloads
      - API_BASE_URL=${API_BASE_URL}
    volumes:
      - ./server:/app
      - ./downloads:/app/downloads
    ports:
      - "3000:3000"
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["node", "server/workers/downloadWorker.js"]
    environment:
      - REDIS_URL=redis://redis:6379
      - NAS_DOWNLOAD_DIR=/app/downloads
      - API_BASE_URL=${API_BASE_URL}
    volumes:
      - ./server:/app
      - ./downloads:/app/downloads
    depends_on:
      - redis
