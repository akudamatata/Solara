<!DOCTYPE html>
<html lang="zh-CN" class="login-page-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>登录 - Solara</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js"></script>

  <style>
    /* ==========================================================================
       Apple Design Tokens & Reset
       ========================================================================== */
    :root {
      --font-sf: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --apple-teal: #34d1b6;
      --apple-teal-hover: #2db8a0;
      --apple-teal-active: #259d88;
      --apple-teal-glow: rgba(52, 209, 182, 0.4);
      --apple-red: #ff453a;
      --apple-red-glow: rgba(255, 69, 58, 0.35);
      --card-bg: rgba(18, 26, 32, 0.65);
      --card-border-top: rgba(255, 255, 255, 0.32);
      --card-border-side: rgba(255, 255, 255, 0.12);
      --card-border-bottom: rgba(255, 255, 255, 0.06);
      --input-bg: rgba(255, 255, 255, 0.065);
      --input-bg-focus: rgba(255, 255, 255, 0.095);
      --input-border: rgba(255, 255, 255, 0.14);
      --text-primary: #f5f5f7;
      --text-secondary: rgba(235, 235, 245, 0.68);
      --text-tertiary: rgba(235, 235, 245, 0.42);
      --spring-snappy: cubic-bezier(0.16, 1, 0.3, 1);
      --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html.login-page-root {
      height: 100%;
      height: 100dvh;
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #06090d;
      overflow: hidden;
    }

    body.login-page {
      min-height: 100%;
      min-height: 100dvh;
      width: 100vw;
      font-family: var(--font-sf);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: clamp(20px, 4vw, 40px);
      padding-top: calc(env(safe-area-inset-top, 0px) + clamp(20px, 4vw, 40px));
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(20px, 4vw, 40px));
    }

    /* ==========================================================================
       Ambient Fluid Aurora Mesh (流体极光环境背景)
       ========================================================================== */
    .ambient-stage {
      position: fixed;
      inset: -20vmax;
      width: 140vmax;
      height: 140vmax;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      filter: blur(75px);
      opacity: 0.88;
      will-change: transform;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      will-change: transform, opacity;
      animation-iteration-count: infinite;
      animation-direction: alternate;
      animation-timing-function: ease-in-out;
    }

    .ambient-orb-1 {
      width: 48vmax;
      height: 48vmax;
      top: 15%;
      left: 15%;
      background: radial-gradient(circle, rgba(16, 163, 127, 0.45) 0%, rgba(26, 188, 156, 0.15) 55%, transparent 70%);
      animation: floatOrb1 22s infinite alternate;
    }

    .ambient-orb-2 {
      width: 55vmax;
      height: 55vmax;
      bottom: 10%;
      right: 15%;
      background: radial-gradient(circle, rgba(46, 134, 193, 0.38) 0%, rgba(52, 152, 219, 0.12) 60%, transparent 75%);
      animation: floatOrb2 26s infinite alternate;
    }

    .ambient-orb-3 {
      width: 40vmax;
      height: 40vmax;
      top: 35%;
      right: 25%;
      background: radial-gradient(circle, rgba(80, 227, 194, 0.28) 0%, rgba(18, 53, 60, 0.08) 60%, transparent 75%);
      animation: floatOrb3 18s infinite alternate;
    }

    @keyframes floatOrb1 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(6vw, 8vh, 0) scale(1.08); }
      100% { transform: translate3d(-4vw, 4vh, 0) scale(0.96); }
    }

    @keyframes floatOrb2 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-8vw, -6vh, 0) scale(1.06); }
      100% { transform: translate3d(5vw, -4vh, 0) scale(0.94); }
    }

    @keyframes floatOrb3 {
      0% { transform: translate3d(0, 0, 0) scale(0.95); }
      100% { transform: translate3d(-6vw, 7vh, 0) scale(1.12); }
    }

    /* 胶片微噪点层 (消除阶断，增强物理质感) */
    .ambient-noise {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.032;
      pointer-events: none;
      z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* 极光边缘暗角 */
    .ambient-vignette {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, transparent 35%, rgba(4, 7, 10, 0.72) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* ==========================================================================
       Login Shell & Card (Apple Glassmorphism)
       ========================================================================== */
    .login-shell {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 418px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(48px) saturate(190%);
      -webkit-backdrop-filter: blur(48px) saturate(190%);
      border-radius: 28px;
      padding: clamp(32px, 5.5vw, 42px) clamp(28px, 5vw, 36px);
      border-top: 1px solid var(--card-border-top);
      border-left: 1px solid var(--card-border-side);
      border-right: 1px solid var(--card-border-side);
      border-bottom: 1px solid var(--card-border-bottom);
      box-shadow:
        0 30px 70px -15px rgba(0, 0, 0, 0.65),
        0 12px 30px -8px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.08) inset;
      display: flex;
      flex-direction: column;
      gap: 28px;
      transition: transform 0.4s var(--spring-snappy), box-shadow 0.4s ease;
      will-change: transform;
    }

    /* macOS 密码错误果冻横向晃动 */
    @keyframes appleShake {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-12px); }
      30% { transform: translateX(10px); }
      45% { transform: translateX(-7px); }
      60% { transform: translateX(6px); }
      75% { transform: translateX(-3px); }
      90% { transform: translateX(2px); }
    }

    .login-card.shake {
      animation: appleShake 0.48s var(--spring-snappy);
    }

    .login-card.has-error {
      border-color: var(--apple-red);
      box-shadow:
        0 30px 70px -15px rgba(0, 0, 0, 0.65),
        0 0 0 2px var(--apple-red-glow),
        0 0 28px var(--apple-red-glow);
    }

    /* ==========================================================================
       Header & App Icon (macOS Squircle)
       ========================================================================== */
    .login-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }

    .logo-squircle-wrapper {
      position: relative;
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 图标外围呼吸光环 */
    .logo-squircle-glow {
      position: absolute;
      inset: -6px;
      border-radius: 26px;
      background: radial-gradient(circle, var(--apple-teal-glow) 0%, transparent 70%);
      filter: blur(10px);
      opacity: 0.75;
      animation: logoGlowPulse 4.5s ease-in-out infinite alternate;
    }

    @keyframes logoGlowPulse {
      0% { opacity: 0.5; transform: scale(0.96); }
      100% { opacity: 0.95; transform: scale(1.06); }
    }

    .logo-squircle {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(32, 45, 54, 0.88), rgba(15, 23, 28, 0.94));
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-top-color: rgba(255, 255, 255, 0.42);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 12px 28px -6px rgba(0, 0, 0, 0.55),
        0 0 1px 1px rgba(255, 255, 255, 0.15) inset;
      backdrop-filter: blur(16px);
      overflow: hidden;
      transition: transform 0.3s var(--spring-snappy);
    }

    .logo-squircle:hover {
      transform: scale(1.04);
    }

    .logo-squircle img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(52, 209, 182, 0.4));
    }

    .title-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .login-title {
      font-size: clamp(1.65rem, 3.5vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-primary);
      line-height: 1.15;
    }

    .login-desc {
      font-size: 0.88rem;
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: -0.005em;
    }

    /* ==========================================================================
       Form & macOS Lock Screen Input
       ========================================================================== */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-inline: 4px;
    }

    .field-label {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    /* Caps Lock 浮动提示药丸 */
    .caps-lock-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      opacity: 0;
      transform: translateY(2px) scale(0.92);
      pointer-events: none;
      transition: opacity 0.2s var(--spring-snappy), transform 0.2s var(--spring-snappy);
    }

    .caps-lock-indicator.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .caps-lock-indicator svg {
      width: 10px;
      height: 10px;
      fill: currentColor;
    }

    /* macOS 密码输入胶囊框 */
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-top-color: rgba(255, 255, 255, 0.24);
      border-radius: 16px;
      padding: 0 14px;
      height: 52px;
      box-shadow:
        0 2px 6px rgba(0, 0, 0, 0.2) inset,
        0 1px 0 rgba(255, 255, 255, 0.06);
      transition:
        background-color 0.2s ease,
        border-color 0.25s var(--spring-snappy),
        box-shadow 0.25s var(--spring-snappy);
    }

    .input-wrapper:hover {
      background: var(--input-bg-focus);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .input-wrapper:focus-within {
      background: var(--input-bg-focus);
      border-color: var(--apple-teal);
      box-shadow:
        0 0 0 3.5px var(--apple-teal-glow),
        0 2px 8px rgba(0, 0, 0, 0.3) inset;
    }

    .input-leading-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      margin-right: 10px;
      color: var(--text-tertiary);
      transition: color 0.2s ease;
      flex-shrink: 0;
    }

    .input-wrapper:focus-within .input-leading-icon {
      color: var(--apple-teal);
    }

    .login-form input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 1rem;
      font-family: inherit;
      letter-spacing: 0.03em;
      height: 100%;
    }

    .login-form input::placeholder {
      color: var(--text-tertiary);
      font-size: 0.94rem;
      letter-spacing: 0;
      transition: opacity 0.2s ease;
    }

    .login-form input:focus::placeholder {
      opacity: 0.6;
    }

    /* 眼睛切换按钮 */
    .input-action-btn {
      background: none;
      border: none;
      outline: none;
      padding: 6px;
      margin-left: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
      transition: color 0.15s ease, transform 0.15s var(--spring-snappy), background 0.15s ease;
    }

    .input-action-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.08);
    }

    .input-action-btn:active {
      transform: scale(0.9);
    }

    .input-action-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .login-hint {
      margin-top: 2px;
      font-size: 0.81rem;
      color: var(--text-tertiary);
      line-height: 1.45;
      text-align: center;
      letter-spacing: -0.01em;
    }

    /* ==========================================================================
       Primary Action Button (Apple Push Button)
       ========================================================================== */
    .btn-submit {
      position: relative;
      width: 100%;
      height: 50px;
      margin-top: 4px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(180deg, #37ddbf 0%, #20b898 100%);
      color: #061c16;
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow:
        0 14px 28px -6px rgba(46, 214, 175, 0.42),
        0 1px 0 rgba(255, 255, 255, 0.45) inset;
      transition:
        transform 0.12s var(--spring-snappy),
        box-shadow 0.2s ease,
        filter 0.2s ease,
        background 0.2s ease;
      will-change: transform;
      user-select: none;
      -webkit-user-select: none;
    }

    .btn-submit:hover {
      filter: brightness(1.05);
      box-shadow:
        0 18px 34px -6px rgba(46, 214, 175, 0.55),
        0 1px 0 rgba(255, 255, 255, 0.6) inset;
    }

    /* 遵循 Apple Design 规范：按下瞬间即时响应微缩放 */
    .btn-submit:active {
      transform: scale(0.975);
      filter: brightness(0.96);
      box-shadow:
        0 8px 18px -4px rgba(46, 214, 175, 0.35),
        0 1px 0 rgba(255, 255, 255, 0.3) inset;
    }

    .btn-submit:disabled {
      cursor: not-allowed;
      opacity: 0.85;
      transform: none !important;
    }

    .btn-submit .btn-icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: transform 0.2s var(--spring-snappy);
    }

    .btn-submit:hover .btn-icon {
      transform: translateX(2px);
    }

    /* Apple 系统级菊花转圈 Spinner */
    .apple-spinner {
      display: none;
      width: 20px;
      height: 20px;
      position: relative;
    }

    .apple-spinner div {
      transform-origin: 10px 10px;
      animation: appleSpinner 0.8s linear infinite;
    }

    .apple-spinner div:after {
      content: " ";
      display: block;
      position: absolute;
      top: 1.5px;
      left: 9px;
      width: 2px;
      height: 5px;
      border-radius: 1px;
      background: #061c16;
    }

    .apple-spinner div:nth-child(1) { transform: rotate(0deg); animation-delay: -0.7s; }
    .apple-spinner div:nth-child(2) { transform: rotate(45deg); animation-delay: -0.6s; }
    .apple-spinner div:nth-child(3) { transform: rotate(90deg); animation-delay: -0.5s; }
    .apple-spinner div:nth-child(4) { transform: rotate(135deg); animation-delay: -0.4s; }
    .apple-spinner div:nth-child(5) { transform: rotate(180deg); animation-delay: -0.3s; }
    .apple-spinner div:nth-child(6) { transform: rotate(225deg); animation-delay: -0.2s; }
    .apple-spinner div:nth-child(7) { transform: rotate(270deg); animation-delay: -0.1s; }
    .apple-spinner div:nth-child(8) { transform: rotate(315deg); animation-delay: 0s; }

    @keyframes appleSpinner {
      0% { opacity: 1; }
      100% { opacity: 0.15; }
    }

    .btn-submit.loading .btn-text,
    .btn-submit.loading .btn-icon {
      display: none;
    }

    .btn-submit.loading .apple-spinner {
      display: block;
    }

    /* ==========================================================================
       Footer & Security Badge
       ========================================================================== */
    .login-footer {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .security-capsule {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-tertiary);
      letter-spacing: 0.01em;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .security-capsule:hover {
      border-color: rgba(255, 255, 255, 0.16);
      color: var(--text-secondary);
    }

    /* 脉冲呼吸安全指示灯 */
    .pulse-dot {
      position: relative;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--apple-teal);
      box-shadow: 0 0 8px var(--apple-teal);
    }

    .pulse-dot::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 1.5px solid var(--apple-teal);
      opacity: 0.6;
      animation: dotPulse 2.4s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }

    @keyframes dotPulse {
      0% { transform: scale(0.8); opacity: 0.8; }
      70% { transform: scale(2.2); opacity: 0; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* ==========================================================================
       macOS Dynamic Island Style Toast (通知胶囊)
       ========================================================================== */
    .apple-toast {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 24px);
      left: 50%;
      transform: translate3d(-50%, -24px, 0) scale(0.92);
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 9999px;
      background: rgba(30, 36, 44, 0.82);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-top-color: rgba(255, 255, 255, 0.35);
      box-shadow:
        0 16px 36px -8px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.08) inset;
      color: var(--text-primary);
      font-size: 0.88rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition:
        transform 0.36s var(--spring-snappy),
        opacity 0.28s ease,
        border-color 0.25s ease;
    }

    .apple-toast.visible {
      opacity: 1;
      transform: translate3d(-50%, 0, 0) scale(1);
      pointer-events: auto;
    }

    .apple-toast.error {
      border-color: rgba(255, 69, 58, 0.5);
      background: rgba(38, 22, 24, 0.85);
    }

    .toast-icon {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .apple-toast.error .toast-icon {
      color: var(--apple-red);
    }

    .apple-toast.success .toast-icon {
      color: var(--apple-teal);
    }

    /* ==========================================================================
       Responsive & Reduced Motion
       ========================================================================== */
    @media (max-width: 480px) {
      .login-shell {
        max-width: 100%;
      }

      .login-card {
        border-radius: 24px;
        padding: 30px 22px;
        gap: 24px;
      }

      .logo-squircle-wrapper {
        width: 64px;
        height: 64px;
      }

      .logo-squircle {
        width: 60px;
        height: 60px;
        border-radius: 17px;
      }

      .logo-squircle img {
        width: 38px;
        height: 38px;
      }

      .login-title {
        font-size: 1.55rem;
      }

      .btn-submit {
        height: 48px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ambient-stage,
      .ambient-orb,
      .pulse-dot::after,
      .logo-squircle-glow {
        animation: none !important;
      }
      .login-card.shake {
        animation: none !important;
      }
      .apple-toast,
      .btn-submit,
      .input-wrapper {
        transition: opacity 0.15s ease !important;
      }
    }
  </style>
</head>
<body class="login-page">

  <!-- 流体极光深邃背景 -->
  <div class="ambient-stage" aria-hidden="true">
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>
    <div class="ambient-orb ambient-orb-3"></div>
  </div>
  <div class="ambient-noise" aria-hidden="true"></div>
  <div class="ambient-vignette" aria-hidden="true"></div>

  <!-- macOS 风格悬浮 Toast 提示 -->
  <aside id="apple-toast" class="apple-toast" role="status" aria-live="polite">
    <span class="toast-icon" id="toast-icon">
      <!-- 动态插入 SVG 图标 -->
    </span>
    <span class="toast-msg" id="toast-msg"></span>
  </aside>

  <!-- 主登录卡片 -->
  <main class="login-shell">
    <section class="login-card spotlight-card" id="login-card">
      
      <!-- 头部应用图标与品牌 -->
      <header class="login-header">
        <div class="logo-squircle-wrapper">
          <div class="logo-squircle-glow"></div>
          <div class="logo-squircle">
            <img src="/favicon.svg" alt="Solara Logo">
          </div>
        </div>
        <div class="title-group">
          <h1 class="login-title">Solara</h1>
          <p class="login-desc">访问受到保护</p>
        </div>
      </header>

      <!-- 登录表单 -->
      <form class="login-form" id="login-form" novalidate>
        <div class="field">
          <div class="field-header">
            <label for="password" class="field-label">访问口令</label>
            <!-- macOS 标志性 Caps Lock 大写锁定检测提示 -->
            <span class="caps-lock-indicator" id="caps-lock-indicator">
              <svg viewBox="0 0 24 24">
                <path d="M12 4L4 12H9V20H15V12H20L12 4Z" />
              </svg>
              大写已锁定
            </span>
          </div>
          
          <div class="input-wrapper" id="input-wrapper">
            <span class="input-leading-icon" aria-hidden="true">
              <!-- 锁定图标 -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            
            <input 
              type="password" 
              id="password" 
              placeholder="请输入密码" 
              autocomplete="current-password" 
              required
              spellcheck="false"
              autocorrect="off"
              autocapitalize="off"
            >

            <!-- 密码显隐切换按钮 -->
            <button type="button" class="input-action-btn" id="toggle-password" aria-label="显示密码" tabindex="-1">
              <svg id="eye-icon" viewBox="0 0 24 24">
                <!-- 闭眼状态 (默认密文) -->
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <p class="login-hint">只有输入了正确口令的成员才能继续访问内容。</p>

        <!-- 提交按钮 -->
        <button type="submit" class="btn-submit" id="submit-button">
          <span class="btn-text">进入 Solara</span>
          <svg class="btn-icon" viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
          <div class="apple-spinner" aria-hidden="true">
            <div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div>
          </div>
        </button>
      </form>

      <!-- 底部安全状态胶囊 -->
      <footer class="login-footer" aria-live="polite">
        <div class="security-capsule">
          <span class="pulse-dot" aria-hidden="true"></span>
          <span class="security-text">安全状态：受保护</span>
        </div>
      </footer>

    </section>
  </main>

  <script>
    (function () {
      // 1. 清除遗留认证缓存
      const storedExpiry = localStorage.getItem("authExpiry");
      if (storedExpiry) {
        localStorage.removeItem("authExpiry");
      }

      // 2. DOM 元素
      const loginCard = document.getElementById("login-card");
      const loginForm = document.getElementById("login-form");
      const passwordInput = document.getElementById("password");
      const inputWrapper = document.getElementById("input-wrapper");
      const togglePasswordBtn = document.getElementById("toggle-password");
      const eyeIcon = document.getElementById("eye-icon");
      const submitBtn = document.getElementById("submit-button");
      const capsLockIndicator = document.getElementById("caps-lock-indicator");
      const appleToast = document.getElementById("apple-toast");
      const toastIcon = document.getElementById("toast-icon");
      const toastMsg = document.getElementById("toast-msg");

      let toastTimer = null;

      // 3. Apple 风格 Toast 浮动通知系统
      const showToast = (message, type = "error") => {
        if (!appleToast) return;
        
        toastMsg.textContent = message;
        appleToast.className = `apple-toast ${type}`;

        if (type === "error") {
          toastIcon.innerHTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          `;
        } else {
          toastIcon.innerHTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
          `;
        }

        appleToast.classList.add("visible");

        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          appleToast.classList.remove("visible");
        }, 3200);
      };

      // 兼容旧接口调用
      window.showNotification = showToast;

      // 4. macOS 经典密码错误果冻晃动效果
      const triggerShakeError = (msg) => {
        if (!loginCard) return;
        
        loginCard.classList.remove("shake", "has-error");
        // 强制重绘，使动画重置
        void loginCard.offsetWidth;
        loginCard.classList.add("shake", "has-error");

        showToast(msg, "error");

        // 触发触觉反馈 (Haptic feedback)
        if (typeof navigator !== "undefined" && typeof navigator.vibrate === "function") {
          navigator.vibrate([24, 40, 24]);
        }

        // 晃动结束后移除 shake 类，保留提示
        setTimeout(() => {
          loginCard.classList.remove("shake");
        }, 500);

        // 重新聚焦并选中文本，方便用户直接重新输入
        if (passwordInput) {
          passwordInput.focus();
          passwordInput.select();
        }
      };

      // 5. 密码显隐切换交互
      let isPasswordVisible = false;
      const eyeOpenSVG = `
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      `;
      const eyeClosedSVG = `
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      `;

      togglePasswordBtn?.addEventListener("click", () => {
        isPasswordVisible = !isPasswordVisible;
        passwordInput.type = isPasswordVisible ? "text" : "password";
        eyeIcon.innerHTML = isPasswordVisible ? eyeOpenSVG : eyeClosedSVG;
        togglePasswordBtn.setAttribute("aria-label", isPasswordVisible ? "隐藏密码" : "显示密码");
        passwordInput.focus();
      });

      // 6. macOS 标志性 Caps Lock 大写锁定检测
      const checkCapsLock = (e) => {
        if (!capsLockIndicator) return;
        const isCapsLock = e.getModifierState && e.getModifierState("CapsLock");
        if (isCapsLock) {
          capsLockIndicator.classList.add("visible");
        } else {
          capsLockIndicator.classList.remove("visible");
        }
      };

      passwordInput?.addEventListener("keydown", checkCapsLock);
      passwordInput?.addEventListener("keyup", checkCapsLock);
      window.addEventListener("keydown", (e) => {
        if (document.activeElement === passwordInput) {
          checkCapsLock(e);
        }
      });

      // 7. 用户重新输入时恢复正常状态边框
      passwordInput?.addEventListener("input", () => {
        loginCard?.classList.remove("has-error");
        // 过滤非 ASCII 字符（保持原逻辑）
        passwordInput.value = passwordInput.value.replace(/[^\x00-\x7F]/g, '');
      });

      // 8. 表单提交与 API 请求
      loginForm?.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = passwordInput ? passwordInput.value.trim() : "";

        if (!password) {
          triggerShakeError("请输入访问口令");
          return;
        }

        // 进入加载状态
        submitBtn.disabled = true;
        submitBtn.classList.add("loading");

        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ password }),
          });

          if (response.ok) {
            submitBtn.classList.remove("loading");
            // 登录成功微过渡
            showToast("验证成功，正在进入...", "success");
            setTimeout(() => {
              window.location.href = "/";
            }, 300);
            return;
          }

          // 密码错误
          triggerShakeError("密码错误，请重试");
        } catch (error) {
          console.error(error);
          triggerShakeError("登录出错，请稍后再试");
        } finally {
          submitBtn.disabled = false;
          submitBtn.classList.remove("loading");
        }
      });

      // 9. Spotlight 鼠标跟随光效
      loginCard?.addEventListener("pointermove", (e) => {
        const rect = loginCard.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        loginCard.style.setProperty("--mouse-x", `${x}px`);
        loginCard.style.setProperty("--mouse-y", `${y}px`);
      });

      // 10. 移动端 VisualViewport 防键盘弹起抖动
      if (window.visualViewport) {
        const updateViewport = () => {
          document.documentElement.style.setProperty("--mobile-vh", `${window.visualViewport.height}px`);
        };
        window.visualViewport.addEventListener("resize", updateViewport);
        window.visualViewport.addEventListener("scroll", updateViewport);
        updateViewport();
      }

      // 11. 桌面端自动对焦
      window.addEventListener("DOMContentLoaded", () => {
        if (!("ontouchstart" in window) && passwordInput) {
          setTimeout(() => passwordInput.focus(), 250);
        }
      });
    })();
  </script>
</body>
</html>
